name: travel_assign
description: "A mini flutter app that showcases feed based on user interests."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.2
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  go_router: ^17.0.0
  shimmer: ^3.0.0
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter_gen:
  output: lib/gen/

flutter:

  uses-material-design: true
  generate: true 
  assets:
    - assets/images/
    - assets/icons/
